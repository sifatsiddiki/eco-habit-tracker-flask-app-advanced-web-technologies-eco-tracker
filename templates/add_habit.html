{% extends 'base.html' %}
{% block content %}
<div class="add-habit-page">
  <h2>Add Habit</h2>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" name="title" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">CO2 saving per action (kg)</label>
      <input class="form-control" name="co2_saving" type="number" step="0.01">
    </div>
    <button class="btn btn-primary">Add</button>
  </form>
</div>
{% endblock %}
